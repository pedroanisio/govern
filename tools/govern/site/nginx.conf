server {
  listen 80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  error_page 404 /404.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml;

  location / {
    try_files $uri $uri/ =404;
  }

  location = /404.html {
    internal;
  }

  # Static files keep their names between builds, so cache for a week and revalidate after that.
  location /static/ {
    expires 7d;
    try_files $uri =404;
  }
}
