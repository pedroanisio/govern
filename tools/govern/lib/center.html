<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>govern command center</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1b1f24; --muted: #5b6573; --line: #dfe3e8;
  --ok: #1a7f37; --warn: #9a6700; --crit: #c62828; --accent: #2457c5; --chip: #eef1f5;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f1216; --panel: #171b21; --ink: #e6e9ed; --muted: #98a2ae; --line: #2a3038;
    --ok: #4ac26b; --warn: #d4a72c; --crit: #f47067; --accent: #6d9cff; --chip: #222831; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { position: sticky; top: 0; z-index: 1; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline;
  padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { margin: 0; font-size: 16px; }
header .meta { color: var(--muted); font-size: 13px; }
header .status { margin-left: auto; font-size: 13px; color: var(--muted); }
main { max-width: 1280px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
main > *, .two > * { min-width: 0; }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
section h2 { margin: 0 0 10px; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.kpi { background: var(--chip); border-radius: 8px; padding: 10px 12px; }
.kpi b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.kpi span { color: var(--muted); font-size: 12px; }
.hosts { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.host { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.host h3 { margin: 0 0 6px; font-size: 15px; display: flex; gap: 8px; align-items: center; }
.host dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 13px; }
.host dt { color: var(--muted); }
.host dd { margin: 0; font-variant-numeric: tabular-nums; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: var(--ok); }
.dot.down { background: var(--crit); }
.tag { font-size: 11px; padding: 1px 6px; border-radius: 99px; background: var(--chip); color: var(--muted); font-weight: 500; }
.alert { padding: 6px 0; border-top: 1px solid var(--line); display: flex; gap: 10px; }
.alert:first-of-type { border-top: 0; }
.alert .lvl { font-weight: 600; min-width: 64px; }
.critical .lvl { color: var(--crit); } .warning .lvl { color: var(--warn); }
.none { color: var(--muted); }
.table { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--line); padding: 6px 8px; white-space: nowrap; }
td { border-bottom: 1px solid var(--line); padding: 6px 8px; vertical-align: top; }
td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.nowrap { white-space: nowrap; font-variant-numeric: tabular-nums; }
td.mono, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.state-failed { color: var(--crit); } .state-open { color: var(--accent); } .state-done { color: var(--muted); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.filters input, .filters select { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
.filters input { flex: 1 1 200px; }
.err { color: var(--crit); }
.two { display: grid; gap: 16px; }
@media (min-width: 980px) { .two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
</style>
</head>
<body>
<header>
  <h1>Command center</h1>
  <span class="meta" id="mesh">loading…</span>
  <span class="status" id="status"></span>
</header>
<main>
  <section><h2>Federation</h2><div class="kpis" id="kpis"></div></section>
  <section><h2>Alerts</h2><div id="alerts"></div></section>
  <section><h2>Hosts</h2><div class="hosts" id="hosts"></div></section>
  <div class="two">
    <section><h2>Agents</h2><div class="table"><table><thead><tr><th>Address</th><th>Kind</th><th>Projects</th><th>Until</th></tr></thead><tbody id="agents"></tbody></table></div></section>
    <section><h2>Spend, last 24 h</h2><div class="table"><table><thead><tr><th>Host</th><th>Agent</th><th>Runs</th><th>Failed</th><th>Cost</th><th>Tokens in / out</th></tr></thead><tbody id="spend"></tbody></table></div></section>
  </div>
  <section>
    <h2>Messages</h2>
    <div class="filters">
      <input id="q" type="search" placeholder="Search sender, recipient, project, summary" aria-label="Search messages">
      <select id="fhost" aria-label="Host"><option value="">All hosts</option></select>
      <select id="fstate" aria-label="State"><option value="">All states</option><option>open</option><option>claimed</option><option>done</option><option>failed</option></select>
    </div>
    <div class="table"><table><thead><tr><th>When</th><th>Host</th><th>State</th><th>Kind</th><th>From → to</th><th>Project / task</th><th>Summary</th></tr></thead><tbody id="messages"></tbody></table></div>
  </section>
</main>
<script>
"use strict";
const token = new URLSearchParams(location.hash.slice(1)).get("token") || "";
let view = null;
const $ = id => document.getElementById(id);
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v !== undefined && v !== null) e.setAttribute(k, v);
  for (const k of kids) e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return e;
}
const usd = n => "$" + n.toFixed(2);
const tok = n => n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? Math.round(n / 1e3) + "k" : String(n);
const when = iso => { const d = new Date(iso); return d.toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }); };
function rows(tbody, list, empty, cols) {
  tbody.replaceChildren(...(list.length ? list : [null]).map(x => x === null
    ? el("tr", {}, el("td", { colspan: String(cols), class: "none" }, empty))
    : x));
}
function render(v) {
  $("mesh").textContent = (v.mesh ? `mesh ${v.mesh.name}${v.mesh.registrar ? " · registrar " + v.mesh.registrar : ""}` : "not in a mesh") + ` · ${v.hosts.length} hosts`;
  const tel = v.hosts.map(h => h.telemetry).filter(Boolean);
  const sum = f => tel.reduce((a, t) => a + f(t), 0);
  $("kpis").replaceChildren(...[
    [`${v.hosts.filter(h => h.ok).length} / ${v.hosts.length}`, "hosts reporting"],
    [sum(t => t.agents.registered.length), "registered agents"],
    [sum(t => t.queue.open), "open messages"],
    [sum(t => t.relay.outboundOpen), "deliveries pending"],
    [sum(t => t.runs24h.count), "runs, 24 h"],
    [usd(sum(t => t.runs24h.costUsd)), "spend, 24 h"],
    [v.alerts.length, "alerts"],
  ].map(([n, l]) => el("div", { class: "kpi" }, el("b", {}, n), el("span", {}, l))));
  $("alerts").replaceChildren(...(v.alerts.length ? v.alerts.map(a => el("div", { class: "alert " + a.level }, el("span", { class: "lvl" }, a.level), el("span", {}, el("b", {}, a.host), ": ", a.message))) : [el("div", { class: "none" }, "Nothing needs attention.")]));
  $("hosts").replaceChildren(...v.hosts.map(h => {
    const t = h.telemetry;
    const head = el("h3", {}, el("span", { class: "dot" + (h.ok ? "" : " down") }), h.host, ...(h.self ? [el("span", { class: "tag" }, "this host")] : []), ...(h.registrar ? [el("span", { class: "tag" }, "registrar")] : []));
    if (!t) return el("div", { class: "host" }, head, el("div", { class: "err" }, h.error || "unreachable"));
    const dl = el("dl", {});
    for (const [k, val] of [
      ["dispatcher", t.dispatcher.running ? "running" : "not running"],
      ["queue", `${t.queue.open} open · ${t.queue.claimed} claimed · ${t.queue.failed} failed`],
      ["relay 24 h", `${t.relay.delivered24h} sent · ${t.relay.inbound24h} received · ${t.relay.outboundOpen} pending`],
      ["runs 24 h", `${t.runs24h.count} (${t.runs24h.failed} failed) · ${usd(t.runs24h.costUsd)}`],
      ["certificate", t.mesh && t.mesh.certExpires ? "until " + when(t.mesh.certExpires) : "—"],
      ["synced", t.mesh ? when(t.mesh.syncedAt) : "—"],
      ["reported", when(t.at)],
    ]) dl.append(el("dt", {}, k), el("dd", {}, val));
    return el("div", { class: "host" }, head, dl);
  }));
  const agents = v.hosts.flatMap(h => h.telemetry ? [
    ...h.telemetry.agents.registered.map(a => el("tr", {}, el("td", { class: "mono" }, `${a.name}@${h.host}` + (a.aliases.length ? ` (${a.aliases.join(", ")})` : "")), el("td", {}, a.kind), el("td", {}, a.projects.join(", ")), el("td", {}, when(a.expires)))),
    el("tr", {}, el("td", { class: "mono" }, `${h.telemetry.agents.runners.join(", ")} @${h.host}`), el("td", {}, "runners"), el("td", {}, "as granted"), el("td", {}, "—")),
  ] : []);
  rows($("agents"), agents, "No agents reported.", 4);
  const spend = v.hosts.flatMap(h => Object.entries(h.telemetry ? h.telemetry.byAgent : {}).map(([a, r]) =>
    el("tr", {}, el("td", {}, h.host), el("td", { class: "mono" }, a), el("td", { class: "num" }, r.count), el("td", { class: "num" }, r.failed), el("td", { class: "num" }, usd(r.costUsd)), el("td", { class: "num" }, `${tok(r.input)} / ${tok(r.output)}`))));
  rows($("spend"), spend, "No runs in the last 24 hours.", 6);
  const sel = $("fhost"), keep = sel.value;
  sel.replaceChildren(el("option", { value: "" }, "All hosts"), ...v.hosts.map(h => el("option", { value: h.host }, h.host)));
  sel.value = keep;
  renderMessages();
}
function renderMessages() {
  if (!view) return;
  const q = $("q").value.toLowerCase(), host = $("fhost").value, state = $("fstate").value;
  const list = view.messages.filter(m => (!host || m.host === host) && (!state || m.state === state)
    && (!q || [m.from, m.to, m.project, m.task, m.summary, m.kind].join(" ").toLowerCase().includes(q)));
  rows($("messages"), list.map(m => el("tr", {},
    el("td", { class: "nowrap" }, when(m.created)), el("td", {}, m.host), el("td", { class: "state-" + m.state }, m.state), el("td", {}, m.kind),
    el("td", { class: "mono" }, `${m.from} → ${m.to}`), el("td", {}, `${m.project} / ${m.task}`),
    el("td", {}, m.summary, ...(m.lastError ? [el("div", { class: "err" }, m.lastError)] : [])))), "No messages match.", 7);
}
async function refresh() {
  if (!token) { $("status").textContent = "Open the address govern center serve printed: it carries the access token."; return; }
  try {
    const r = await fetch("/api/state", { headers: { Authorization: "Bearer " + token }, cache: "no-store" });
    const body = await r.json();
    if (!r.ok) throw new Error(body.error || r.status);
    view = body; render(view);
    $("status").textContent = "updated " + new Date(view.at).toLocaleTimeString();
  } catch (e) { $("status").textContent = "update failed: " + e.message; $("status").className = "status err"; return; }
  $("status").className = "status";
}
for (const id of ["q", "fhost", "fstate"]) $(id).addEventListener("input", renderMessages);
refresh(); setInterval(refresh, 15000);
</script>
</body>
</html>
