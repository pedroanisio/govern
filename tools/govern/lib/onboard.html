<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Box Setup</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --ink: #16181d; --muted: #5d6470; --line: #e3e6eb;
  --accent: #3b5bdb; --accent-ink: #ffffff; --ok: #1f8a4c; --ok-bg: #e7f5ec; --bad: #c92a2a; --bad-bg: #fdecec;
  --you: #b35c00; --you-bg: #fff3e0; --code: #f1f3f5; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #111317; --card: #1a1d23; --ink: #e9ecef; --muted: #a0a7b3; --line: #2b2f37; --accent: #748ffc; --accent-ink: #0b0d12;
    --ok: #51cf66; --ok-bg: #16281c; --bad: #ff8787; --bad-bg: #2d1a1a; --you: #ffa94d; --you-bg: #2d2214; --code: #22262e;
    --shadow: 0 1px 2px rgba(0,0,0,.4); }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 760px; margin: 0 auto; padding: 28px 16px 48px; }
.wrap > *, .what, .cmd code { min-width: 0; }
.brand { color: var(--muted); font-size: 14px; font-weight: 600; letter-spacing: .02em; margin: 0 0 14px; }
/* The stepper: one dot per step, then Finish. */
ol.steps { list-style: none; margin: 0 0 18px; padding: 0; display: flex; gap: 4px; align-items: center; }
ol.steps li { flex: 1; display: flex; align-items: center; gap: 4px; min-width: 0; } ol.steps li:last-child { flex: none; }
ol.steps li:not(:last-child)::after { content: ""; flex: 1; height: 2px; background: var(--line); border-radius: 2px; }
ol.steps li.done:not(:last-child)::after { background: var(--ok); }
.dot { width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 14px; font-weight: 700;
  background: var(--line); color: var(--muted); border: 2px solid transparent; }
.dot.ok { background: var(--ok-bg); color: var(--ok); } .dot.you { background: var(--you-bg); color: var(--you); }
.dot.here { border-color: var(--accent); color: var(--accent); background: var(--card); }
.steplabel { font-size: 14px; color: var(--muted); margin: -8px 0 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 28px; }
@media (max-width: 520px) { .card { padding: 20px 16px; } .dot { width: 24px; height: 24px; font-size: 12px; } }
.card h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: -.01em; } .card h2 { font-size: 22px; margin: 0 0 6px; }
.lead { margin: 0 0 18px; color: var(--muted); }
.hero { text-align: center; padding: 12px 0 4px; } .hero .big { font-size: 52px; line-height: 1.1; }
.spin { width: 44px; height: 44px; margin: 8px auto 14px; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--accent); animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
ul.plan { list-style: none; padding: 0; margin: 0 0 8px; display: grid; gap: 8px; }
ul.plan li { display: flex; gap: 12px; align-items: baseline; } ul.plan .n { font-weight: 700; color: var(--accent); width: 18px; flex: none; }
ul.plan .t { font-weight: 600; } ul.plan .d { color: var(--muted); font-size: 14px; display: block; }
ul.fixed { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 6px; }
ul.fixed li { background: var(--ok-bg); color: var(--ok); border-radius: 10px; padding: 8px 12px; font-size: 15px; }
.item { border: 1px solid color-mix(in srgb, var(--you) 40%, var(--line)); background: color-mix(in srgb, var(--you-bg) 55%, var(--card));
  border-radius: 14px; padding: 16px; margin: 12px 0; }
.item b { display: block; font-size: 17px; } .item p { margin: 6px 0 0; }
.cmd { display: flex; gap: 8px; align-items: stretch; margin-top: 10px; }
.cmd code { flex: 1; background: var(--code); border-radius: 8px; padding: 8px 10px; font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; overflow-wrap: anywhere; }
.form { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
input[type=password] { flex: 1; min-width: 200px; font: inherit; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
.note { font-size: 14px; color: var(--muted); } .msg { margin-top: 8px; font-size: 14px; } .msg.bad { color: var(--bad); } .msg.ok { color: var(--ok); }
details { margin-top: 16px; } details summary { cursor: pointer; color: var(--muted); font-size: 14px; }
details ul { margin: 8px 0 0; padding-left: 20px; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.foot { display: flex; gap: 10px; margin-top: 24px; align-items: center; flex-wrap: wrap; }
.foot .grow { flex: 1; }
button { font: inherit; font-weight: 600; border-radius: 10px; padding: 10px 18px; cursor: pointer; border: 1px solid var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); } button.ghost { background: transparent; color: var(--accent); }
button.link { border: 0; background: transparent; color: var(--muted); padding: 10px 8px; font-weight: 500; }
button.big { padding: 12px 26px; font-size: 17px; }
button:disabled { opacity: .55; cursor: progress; }
button:focus-visible, input:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; }
ul.summary { list-style: none; padding: 0; margin: 18px 0 0; display: grid; gap: 8px; text-align: left; }
ul.summary li { display: flex; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
ul.summary li .what { flex: 1; } ul.summary .note { display: block; }
</style>
</head>
<body>
<div class="wrap">
  <p class="brand">govern · box setup</p>
  <ol class="steps" id="steps" aria-label="Setup steps"></ol>
  <p class="steplabel" id="steplabel"></p>
  <section class="card" id="card" aria-live="polite"></section>
</div>
<script>
"use strict";
// A next-next-finish wizard. Entering a step asks the server for its automatic pass (POST /api/auto): the server checks
// the step, fixes what the box can fix on its own, and checks again. The page shows what is left for a person, if
// anything; it never chooses a command, it names findings by id.
const STEPS = {
  govern:     { title: "Govern", what: "The engine that runs your squads", working: "Checking govern and Node.js…" },
  engines:    { title: "AI assistants", what: "Claude and Codex, installed and signed in", working: "Checking Claude and Codex…" },
  workspaces: { title: "Squads", what: "Each squad's settings, and a self-test of its AI profiles", working: "Checking your squads and self-testing their AI profiles. The first time this can take a few minutes…" },
  services:   { title: "Background services", what: "Dispatchers, drivers and timers that keep work moving", working: "Checking the background services and starting any that are stopped…" },
  slack:      { title: "Slack", what: "The bot token, the team, the channel and the listener", working: "Checking Slack…" },
  checks:     { title: "Tools & access", what: "Docker images and access each squad needs", working: "Checking tools and access…" },
};
const NAMES = { installed: "is installed", login: "is signed in", found: "exists", config: "settings", processes: "processes",
  profiles: "AI profiles", token: "bot token", auth: "Slack accepts the token", channel: "bot is in the channel",
  listener: "listener is reading the channel", enabled: "Slack is turned on" };
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
function label(id) {
  const p = id.split(":");
  if (id === "govern:version") return "Govern version";
  if (id === "govern:node") return "Node.js";
  if (id === "services:linger") return "Services keep running after you log out";
  if (p[0] === "engines") return `${cap(p[1])} ${NAMES[p[2]] || p[2]}`;
  if (p[0] === "services") return `${p.slice(2).join(":").replace(/\.service$/, "")} is running`;
  if (p[0] === "checks" && p[2] === "image") return `Image ${p.slice(3).join(":")}`;
  if (p[0] === "checks") return `${p[1]}: ${p.slice(2).join(":")} check`;
  if (p.length >= 3) return `${p[1]}: ${NAMES[p[2]] || p[2]}`;
  return cap(id.replace(/^[a-z]+:/, ""));
}
/** A failing finding as a thing to do. */
function todoLabel(id) {
  const p = id.split(":"), who = cap(p[1] || "");
  if (p[0] === "engines" && p[2] === "login") return `Sign in to ${who}`;
  if (p[0] === "engines" && p[2] === "installed") return `Install ${who}`;
  if (id === "services:linger") return "Keep services running after you log out";
  if (p[0] === "slack" && p[2] === "token") return `Slack bot token for ${p[1]}`;
  if (p[0] === "slack" && p[2] === "channel") return `Invite the bot to ${p[1]}'s channel`;
  return label(id);
}
const fixedText = (a) => {
  const l = label(a.id);
  return a.id.startsWith("services:") && a.id !== "services:linger" ? `Started ${l.replace(/ is running$/, "")}`
    : a.id.endsWith(":profiles") ? `Self-tested ${l.split(":")[0]}'s AI profiles`
    : a.id.endsWith(":enabled") ? `Turned on Slack for ${a.id.split(":")[1]}`
    : a.id.endsWith(":token") ? (a.saved ? "Saved the Slack bot token" : "Made the Slack token file private") : `Fixed: ${l}`;
};

const token = (() => {
  const m = /token=([A-Za-z0-9_-]+)/.exec(location.hash);
  try { if (m) { sessionStorage.setItem("onboard-token", m[1]); history.replaceState(null, "", location.pathname); } return m ? m[1] : sessionStorage.getItem("onboard-token"); }
  catch { return m ? m[1] : null; }
})();
let groups = Object.keys(STEPS);
// at: "welcome", a group, or "finish". results[g]: { findings, applied, error? } of the step's last pass.
let at = "welcome", results = {}, working = null, errors = {}, skipped = new Set();

async function api(path, body) {
  const r = await fetch(path, { method: body ? "POST" : "GET", headers: { Authorization: `Bearer ${token}`, ...(body ? { "Content-Type": "application/json" } : {}) }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({ error: `HTTP ${r.status}` }));
  if (!r.ok && !j.findings) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else if (v !== undefined && v !== false) e.setAttribute(k, v === true ? "" : v);
  for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false) e.append(k);
  return e;
};
const show = (...kids) => document.getElementById("card").replaceChildren(...kids.flat().filter((k) => k !== null && k !== undefined && k !== false));
const failing = (g) => (results[g]?.findings || []).filter((f) => f.status === "fail");
const ready = (g) => results[g] && !failing(g).length;

function renderSteps() {
  const ol = document.getElementById("steps"); ol.replaceChildren();
  [...groups, "finish"].forEach((g, i) => {
    const here = g === at, done = g === "finish" ? false : ready(g), you = g !== "finish" && results[g] && !done;
    const mark = done ? "✓" : you ? "!" : g === "finish" ? "★" : String(i + 1);
    const name = g === "finish" ? "Finish" : STEPS[g]?.title || g;
    ol.append(el("li", { class: done ? "done" : "" }, el("span", { class: `dot ${done ? "ok" : you ? "you" : ""} ${here ? "here" : ""}`, title: name,
      "aria-label": `${name}: ${done ? "ready" : you ? "needs you" : "not done yet"}`, "aria-current": here ? "step" : false }, mark)));
  });
  const i = groups.indexOf(at);
  document.getElementById("steplabel").textContent = i >= 0 ? `Step ${i + 1} of ${groups.length} · ${STEPS[at]?.title || at}` : at === "finish" ? "Finish" : "Welcome";
}
const focusPrimary = () => requestAnimationFrame(() => document.querySelector("#card [data-primary]")?.focus());
function go(where) { at = where; render(); window.scrollTo({ top: 0 }); if (groups.includes(where) && !results[where] && !working) pass(where); }
const next = (g) => groups[groups.indexOf(g) + 1] || "finish";
const prev = (g) => groups[groups.indexOf(g) - 1] || "welcome";

function copyButton(text) {
  return el("button", { class: "ghost", onclick: async (ev) => { try { await navigator.clipboard.writeText(text); ev.target.textContent = "Copied"; setTimeout(() => (ev.target.textContent = "Copy"), 1500); } catch { ev.target.textContent = "Select and copy"; } } }, "Copy");
}
/** One thing left for a person. A failed automatic fix says what it tried. */
function todoView(f, tried) {
  const box = el("div", { class: "item" }, el("b", {}, todoLabel(f.id)));
  if (f.action?.kind === "slack-token") {
    box.append(el("p", {}, "Paste your Slack app's bot token (in Slack: your app → OAuth & Permissions → Bot User OAuth Token). It is saved on this box only, readable by you alone."),
      el("div", { class: "form" }, el("input", { type: "password", autocomplete: "off", spellcheck: "false", placeholder: "xoxb-…", "aria-label": "Slack bot token", "data-token": f.id })));
  } else {
    box.append(el("p", {}, f.fix || "See the details below."));
    if (f.command) box.append(el("div", { class: "cmd" }, el("code", {}, f.command), copyButton(f.command)));
  }
  if (tried && !tried.ok) box.append(el("p", { class: "msg bad" }, `We tried to fix this automatically, but it did not work: ${tried.output}`));
  box.append(el("details", {}, el("summary", {}, "What we found"), el("ul", {}, el("li", {}, f.evidence))));
  return box;
}

function render() {
  renderSteps();
  if (!token) { show(el("h1", {}, "Open the link govern printed"), el("p", { class: "lead" }, "This page needs the address with #token=… that govern onboard printed in the terminal.")); return; }

  if (at === "welcome") {
    show(el("h1", {}, "Let's set up this box"),
      el("p", { class: "lead" }, "We'll go through six steps. In each one we check what this machine needs to run your squads and fix what we can on our own. You'll only be asked for what needs a person, like signing in or pasting a token."),
      el("ul", { class: "plan" }, groups.map((g, i) => el("li", {}, el("span", { class: "n" }, String(i + 1)), el("span", {}, el("span", { class: "t" }, STEPS[g]?.title || g), el("span", { class: "d" }, STEPS[g]?.what || ""))))),
      el("div", { class: "foot" }, el("span", { class: "grow" }), el("button", { class: "primary big", "data-primary": true, onclick: () => go(groups[0]) }, "Start setup →")));
    return focusPrimary();
  }

  if (at === "finish") {
    const left = groups.filter((g) => !ready(g));
    const hero = left.length
      ? [el("div", { class: "big", "aria-hidden": "true" }, "✋"), el("h1", {}, "Almost there"), el("p", { class: "lead" }, `${left.length === 1 ? "One step still needs" : `${left.length} steps still need`} you. Open it, do what it asks, and come back here.`)]
      : [el("div", { class: "big", "aria-hidden": "true" }, "🎉"), el("h1", {}, "Your box is ready"), el("p", { class: "lead" }, "Govern, the AI assistants, your squads, their services and Slack all passed. You can close this page.")];
    show(el("div", { class: "hero" }, ...hero),
      el("ul", { class: "summary" }, groups.map((g) => el("li", {}, el("span", { class: `dot ${ready(g) ? "ok" : "you"}`, "aria-hidden": "true" }, ready(g) ? "✓" : "!"),
        el("span", { class: "what" }, STEPS[g]?.title || g, el("span", { class: "note" }, ready(g) ? "Ready" : !results[g] ? "Not checked" : `${failing(g).length} thing${failing(g).length > 1 ? "s" : ""} to do`)),
        ready(g) ? null : el("button", { class: "ghost", onclick: () => go(g) }, "Open")))),
      el("div", { class: "foot" }, el("button", { class: "link", onclick: () => go(groups[groups.length - 1]) }, "← Back"), el("span", { class: "grow" }),
        el("button", { class: left.length ? "primary" : "ghost", "data-primary": left.length ? true : false, disabled: !!working, onclick: () => checkAll() }, working ? "Checking…" : "Check everything again")));
    return focusPrimary();
  }

  const g = at, s = STEPS[g] || { title: g, what: "", working: "Checking…" }, r = results[g];
  const back = el("button", { class: "link", disabled: !!working, onclick: () => go(prev(g)) }, "← Back");
  const nextLabel = next(g) === "finish" ? "Finish" : `Next: ${STEPS[next(g)]?.title || next(g)} →`;
  if (working === g || !r) {
    show(el("div", { class: "hero" }, el("div", { class: "spin", role: "img", "aria-label": "Working" }), el("h2", {}, s.title), el("p", { class: "lead" }, s.working)),
      el("div", { class: "foot" }, back));
    return;
  }
  if (errors[g]) {
    show(el("h2", {}, `${s.title}: we could not check this step`), el("p", { class: "lead" }, errors[g]),
      el("div", { class: "foot" }, back, el("span", { class: "grow" }), el("button", { class: "primary", "data-primary": true, onclick: () => pass(g) }, "Try again")));
    return focusPrimary();
  }
  const fixed = (r.applied || []).filter((a) => a.ok && !failing(g).some((f) => f.id === a.id));
  const fixedList = fixed.length ? el("ul", { class: "fixed" }, fixed.map((a) => el("li", {}, `✓ ${fixedText(a)}`))) : null;
  const checked = r.findings.filter((f) => f.status !== "fail");
  const details = checked.length ? el("details", {}, el("summary", {}, `What we checked (${checked.length})`),
    el("ul", {}, checked.map((f) => el("li", {}, `${f.status === "skip" ? "Not checked" : "✓"} ${label(f.id)}: ${f.evidence}`)))) : null;

  if (ready(g)) {
    show(el("div", { class: "hero" }, el("div", { class: "big", "aria-hidden": "true" }, "✅"), el("h2", {}, `${s.title}: all set`),
      el("p", { class: "lead" }, fixed.length ? `We fixed ${fixed.length === 1 ? "one thing" : `${fixed.length} things`} for you.` : "Nothing to fix here.")),
      fixedList, details,
      el("div", { class: "foot" }, back, el("span", { class: "grow" }), el("button", { class: "primary big", "data-primary": true, onclick: () => go(next(g)) }, nextLabel)));
    return focusPrimary();
  }

  const todo = failing(g), hasToken = todo.some((f) => f.action?.kind === "slack-token");
  const tried = (id) => (r.applied || []).find((a) => a.id === id);
  show(el("h2", {}, `Your turn: ${s.title}`),
    el("p", { class: "lead" }, `${fixed.length ? `We fixed ${fixed.length === 1 ? "one thing" : `${fixed.length} things`} on our own. ` : ""}${todo.length === 1 ? "One thing needs" : `${todo.length} things need`} a person. Do ${todo.length === 1 ? "it" : "them"}, then press ${hasToken ? "Save and continue" : "Continue"}.`),
    ...todo.map((f) => todoView(f, tried(f.id))),
    r.message ? el("p", { class: "msg bad", role: "status" }, r.message) : null,
    fixedList, details,
    el("div", { class: "foot" }, back, el("span", { class: "grow" }),
      el("button", { class: "link", onclick: () => { skipped.add(g); go(next(g)); } }, "Skip for now"),
      el("button", { class: "primary big", "data-primary": true, onclick: () => continueStep(g) }, hasToken ? "Save and continue" : "Continue")));
  if (!hasToken) focusPrimary(); else requestAnimationFrame(() => document.querySelector("#card [data-token]")?.focus());
}

/** The step's automatic pass. `notes` carries the outcome of saved tokens into the step's result. */
async function pass(g, notes = []) {
  working = g; delete errors[g]; render();
  try {
    const j = await api("/api/auto", { group: g });
    if (j.groups) groups = j.groups;
    results[g] = { findings: j.findings, applied: [...notes, ...(j.applied || [])] };
  } catch (e) { errors[g] = e.message; results[g] = results[g] || { findings: [], applied: [] }; }
  finally { working = null; render(); }
}
/** Continue: save any pasted token, run the step again, and move on when it passes. */
async function continueStep(g) {
  const inputs = [...document.querySelectorAll("#card [data-token]")], notes = [];
  let message = "";
  working = g; render();
  for (const input of inputs) {
    if (!input.value.trim()) { message = "Paste the token first."; continue; }
    try { const j = await api("/api/fix", { id: input.dataset.token, value: input.value }); if (!j.applied?.ok) message = j.applied?.output || j.error || "The token was not saved."; else notes.push({ id: input.dataset.token, ok: true, output: j.applied.output, saved: true }); }
    catch (e) { message = e.message; }
  }
  await pass(g, notes);
  const done = ready(g) && !errors[g];
  if (!done && results[g]) results[g].message = message || "Still not done. Check the steps above, then press Continue again, or skip it for now.";
  if (done) { skipped.delete(g); go(next(g)); } else render();
}
async function checkAll() {
  for (const g of groups) await pass(g);
}
render();
</script>
</body>
</html>
